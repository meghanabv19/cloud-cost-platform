[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-cost-platform"
version = "0.1.0"
description = "Multi-source usage & cost tracking from programmatic APIs only (DuckDB + dbt + Streamlit)."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools]
packages = ["ingestion", "analysis", "dashboards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
