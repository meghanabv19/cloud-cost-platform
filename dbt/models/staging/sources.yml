version: 2

sources:
  - name: warehouse
    description: "Hot DuckDB store written by the ingestion scripts."
    schema: main
    tables:
      - name: usage_facts
        description: "Unified fact table: one row per platform/resource/date/unit."
        columns:
          - name: row_key
            tests: [not_null, unique]
          - name: platform
            tests: [not_null]
          - name: date
            tests: [not_null]
